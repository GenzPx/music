plugins {
    id 'com.android.application'
}

android {
    namespace 'com.genzpx.video'
    compileSdk 34

    defaultConfig {
        applicationId "com.genzpx.video"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.0"
        resourceConfigurations += ["en", "in"]
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Tanpa suffix: tidak pernah ada aplikasi debug terpisah di perangkat.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media:media:1.7.0'

    // Media3 tanpa modul jaringan.
    //
    // media3-exoplayer, -ui, dan -session TIDAK memerlukan izin INTERNET.
    // Yang memerlukannya adalah media3-datasource-* / -exoplayer-dash / -hls /
    // -smoothstreaming, dan modul-modul itu sengaja tidak dipakai karena
    // aplikasi ini hanya memutar berkas lokal.
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
}
