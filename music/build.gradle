plugins {
    id 'com.android.application'
}

android {
    namespace 'com.genzpx.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.genzpx.music"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.0"
        resourceConfigurations += ["en", "in"]
    }

    signingConfigs {
        release {
            // Diisi lewat environment variable saat build di GitHub Actions.
            // Kalau tidak ada keystore, build tetap jalan sebagai unsigned/debug-signed.
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Tidak ada suffix: tidak pernah ada aplikasi "Music debug" terpisah.
            // Rilis resmi tetap hanya satu APK dari buildType release.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
}
