name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis (contoh: 1.0)'
        required: false
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      - name: Siapkan keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Keystore dari secret dipakai."
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias music -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=GenzPx, OU=NoAds, O=GenzPx, L=Jakarta, C=ID"
            echo "::warning::KEYSTORE_BASE64 belum diset. Memakai keystore sementara — APK ini tidak bisa menimpa versi yang sudah terpasang."
          fi
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build kedua APK release
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'music' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew :music:assembleRelease :video:assembleRelease --no-daemon --stacktrace

      - name: Pastikan tidak ada izin INTERNET di kedua APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          FAIL=0
          for APK in $(find music/build/outputs/apk/release video/build/outputs/apk/release -name "*.apk"); do
            echo "--- Memeriksa $APK ---"
            "$BT/aapt2" dump badging "$APK" | grep "uses-permission" || true
            if "$BT/aapt2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then
              echo "::error::$APK meminta izin INTERNET."
              FAIL=1
            else
              echo "OK: tanpa izin INTERNET"
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

      - name: Ganti nama APK
        id: rename
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          [ -z "$VER" ] && VER="1.0"

          MUSIC=$(find music/build/outputs/apk/release -name "*.apk" | head -1)
          VIDEO=$(find video/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$MUSIC" "Music-v${VER}.apk"
          cp "$VIDEO" "Video-v${VER}.apk"

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ls -lh Music-v${VER}.apk Video-v${VER}.apk

      - name: Unggah artifact (hanya untuk uji coba manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            Music-v${{ steps.rename.outputs.version }}.apk
            Video-v${{ steps.rename.outputs.version }}.apk
          retention-days: 90

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Music-v${{ steps.rename.outputs.version }}.apk
            Video-v${{ steps.rename.outputs.version }}.apk
          name: v${{ steps.rename.outputs.version }}
          body: |
            Dua pemutar media offline tanpa iklan, tanpa login, tanpa akun.

            | Berkas | Isi |
            |---|---|
            | `Music-v${{ steps.rename.outputs.version }}.apk` | Pemutar musik |
            | `Video-v${{ steps.rename.outputs.version }}.apk` | Pemutar video |

            Keduanya berdiri sendiri. Pasang salah satu atau dua-duanya.

            **Tanpa izin INTERNET.** Setiap build diperiksa otomatis — kalau
            salah satu APK sampai meminta izin internet, build digagalkan.

            ### Video
            Memutar MP4, MKV, HEVC, AV1, dan lainnya lewat Media3 ExoPlayer.
            Geser untuk mengatur volume, kecerahan, dan maju mundur. Mendukung
            subtitle di dalam berkas, jalur audio ganda, kecepatan putar,
            layar mengambang, kunci layar, dan lanjut dari posisi terakhir.

            ### Music
            Jelajah per Lagu, Album, Artis, dan Folder. Pemutaran latar dengan
            kontrol notifikasi, timer tidur, equalizer sistem, dan antrean.

            ### Cara pasang
            1. Unduh berkas `.apk` yang diinginkan
            2. Buka lewat pengelola berkas di HP
            3. Kalau muncul peringatan, izinkan "Instal aplikasi tak dikenal"
            4. Beri izin baca berkas media saat diminta

            Minimal Android 7.0. Sumber terbuka, lisensi GPL-3.0.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
