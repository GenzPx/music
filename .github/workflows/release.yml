name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis (contoh: 0.1)'
        required: false
        default: '0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      - name: Siapkan keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore dari secret dipakai."
          else
            # Tidak ada secret: bikin keystore sementara supaya APK tetap bisa dipasang.
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias music -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=GenzPX, OU=Music, O=GenzPX, L=Jakarta, C=ID"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 belum diset. Memakai keystore sementara — update APK berikutnya mungkin tidak bisa menimpa versi ini."
          fi

      - name: Build APK release
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'music' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Pastikan tidak ada izin INTERNET
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Memeriksa: $APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if "$BT/aapt2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK meminta izin INTERNET. Build dibatalkan."
            exit 1
          fi
          echo "OK: APK tidak punya izin INTERNET."
          "$BT/aapt2" dump badging "$APK" | grep "uses-permission"

      - name: Ganti nama APK
        id: rename
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          [ -z "$VER" ] && VER="0.1"
          NEW="Music-v${VER}.apk"
          cp "$APK" "$NEW"
          echo "apk=$NEW" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-APK
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 90

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          name: Music v${{ steps.rename.outputs.version }}
          body: |
            ## Music v${{ steps.rename.outputs.version }}

            Pemutar musik offline tanpa iklan, tanpa login, tanpa akun.

            **Tanpa izin INTERNET.** Setiap build diperiksa otomatis —
            kalau APK sampai meminta izin internet, build langsung digagalkan.

            ### Cara pasang
            1. Unduh `Music-v${{ steps.rename.outputs.version }}.apk` di bawah
            2. Buka file lewat pengelola berkas di HP
            3. Kalau muncul peringatan, izinkan "Instal aplikasi tak dikenal"
            4. Buka aplikasi, beri izin baca file audio

            ### Perlu diketahui
            - Minimal Android 7.0 (API 24)
            - Aplikasi ini tidak menggantikan aplikasi bawaan, keduanya bisa
              terpasang bersamaan
            - Sumber terbuka, lisensi GPL-3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
